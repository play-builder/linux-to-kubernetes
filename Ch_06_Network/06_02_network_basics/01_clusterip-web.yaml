apiVersion: apps/v1
kind: Deployment
metadata:
  name: clusterip-web
  labels:
    app: clusterip-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clusterip-web
  template:
    metadata:
      labels:
        app: clusterip-web
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80 # The port the container listens on
---
apiVersion: v1
kind: Service
metadata:
  name: clusterip-web
spec:
  type: ClusterIP
  selector:
    app: clusterip-web
  ports:
  - port: 8080      # The port the Service exposes
    targetPort: 80  # The port to route to on the Pod
    protocol: TCP
