apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeport-web
  labels:
    app: nodeport-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodeport-web
  template:
    metadata:
      labels:
        app: nodeport-web
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nodeport-web
  labels:
    app: nodeport-web
spec:
  type: NodePort
  selector:
    app: nodeport-web
  ports:
  - port: 8080
    targetPort: 80
    nodePort: 31234 # Static port exposed on all Nodes (30000-32767)
    protocol: TCP
