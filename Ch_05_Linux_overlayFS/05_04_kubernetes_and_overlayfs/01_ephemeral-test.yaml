apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-evict-test
  labels:
    app: storage-test
spec:
  containers:
  - name: stress-container
    image: ubuntu:22.04
    command: ["/bin/sh", "-c"]
    args:
    - >
      echo "Writing 150MB to OverlayFS...";
      dd if=/dev/zero of=/tmp/largefile bs=1M count=150;
      sleep 3600
    resources:
      requests:
        ephemeral-storage: "50Mi"
      limits:
        ephemeral-storage: "100Mi"
