# (1) self-signed Root Issuer — 조직 최상위 CA 역할
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root
spec:
  selfSigned: {}
---
# (2) Root CA 인증서 발급
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: shop-root-ca
  secretName: root-ca-secret
  duration: 87600h      # 10년
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
---
# (3) Root로 서명하는 CA Issuer
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: root-ca-issuer
spec:
  ca:
    secretName: root-ca-secret
---
# (4) Intermediate CA — istiod가 실제로 사용할 CA
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: istio-intermediate-ca
  namespace: istio-system
spec:
  isCA: true
  commonName: istio-intermediate-ca
  secretName: istio-intermediate-ca-secret
  duration: 8760h       # 1년
  renewBefore: 720h     # 만료 30일 전 자동 갱신
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: root-ca-issuer
    kind: ClusterIssuer
