# 07_03_istio_ambient_zero_trust/03-pki/03-cacerts-rbac.yaml
# PKI 운영자 전용 — cacerts·원본 Secret에 한정한 최소권한
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pki-cacerts-operator
  namespace: istio-system
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["cacerts", "istio-intermediate-ca-secret"]
  verbs: ["get", "list", "update", "patch"]   # delete는 의도적으로 제외
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pki-cacerts-operator
  namespace: istio-system
subjects:
- kind: Group
  name: pki-admins          # 조직 IdP/SSO의 PKI 운영 그룹으로 교체
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: pki-cacerts-operator
  apiGroup: rbac.authorization.k8s.io
