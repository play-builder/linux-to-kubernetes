# 네임스페이스 자원 격리 — shop NS 전체 자원 상한 + Pod 기본값
apiVersion: v1
kind: ResourceQuota
metadata:
  name: shop-quota
  namespace: shop
spec:
  hard:
    requests.cpu: "4"          # NS 전체 CPU 요청 합 상한
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "50"                 # 최대 Pod 수
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: shop-limits
  namespace: shop
spec:
  limits:
  - type: Container
    default:                   # limits 미지정 컨테이너 기본값
      cpu: 500m
      memory: 512Mi
    defaultRequest:            # requests 미지정 컨테이너 기본값
      cpu: 100m
      memory: 128Mi
    max:                       # 컨테이너당 최대
      cpu: "2"
      memory: 4Gi
