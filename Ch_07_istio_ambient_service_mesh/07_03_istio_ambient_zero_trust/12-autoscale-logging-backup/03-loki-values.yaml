# (보강판 — Loki 3.7.x, grafana-community/loki 차트 기준, SingleBinary + retention/compactor)
# 적용 전 helm show values grafana-community/loki 로 차트 버전별 스키마 확인 권장
deploymentMode: SingleBinary          # 실습/소규모: 단일 프로세스 모드
loki:
  auth_enabled: false                 # 단일 테넌트 (보안 절에서 보호책 적용)
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem                  # 실습: 로컬 PV / 프로덕션: S3 권장
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 336h            # 14일 보관
    reject_old_samples: true
    reject_old_samples_max_age: 168h
  compactor:
    retention_enabled: true           # 만료 청크 실제 삭제 담당
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
# SingleBinary 모드에서는 분산 컴포넌트를 0으로 고정
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
