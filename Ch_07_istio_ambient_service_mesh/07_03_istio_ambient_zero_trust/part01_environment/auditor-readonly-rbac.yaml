apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-readiness-auditor
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "services", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-readiness-auditor-binding
subjects:
- kind: Group
  name: env-auditors            # 사내 IdP 그룹과 매핑
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: node-readiness-auditor
  apiGroup: rbac.authorization.k8s.io
