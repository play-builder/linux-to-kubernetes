# api로 30회 요청 발생 (메트릭·추적 데이터 생성 — L7 정책 통과를 위해 frontend 신원)
# 고QPS 정량 부하(fortio)는 kubectl run fortio 패턴 사용
apiVersion: v1
kind: Pod
metadata:
  name: load-gen
  namespace: shop
spec:
  restartPolicy: Never
  serviceAccountName: frontend
  containers:
  - name: load-gen
    image: playbuilder/netshoot:latest
    command:
    - sh
    - -c
    - 'for i in $(seq 1 30); do curl -s -o /dev/null http://api.shop.svc.cluster.local:8080/products; done; echo "done"'
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 65532
      capabilities: { drop: ["ALL"] }
      seccompProfile: { type: RuntimeDefault }
