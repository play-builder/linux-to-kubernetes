apiVersion: v1
kind: Pod
metadata:
  name: latency-baseline
  namespace: shop
spec:
  restartPolicy: Never
  containers:
  - name: probe
    image: playbuilder/netshoot:latest   # 운영은 digest 고정
    command: ["sh", "-c",
      "for i in $(seq 1 30); do \
         curl -s -o /dev/null -w '%{time_total}\\n' --max-time 5 \
           http://shop-gateway.istio-ingress.svc.cluster.local/; \
       done | sort -n | awk '{a[NR]=$1} END {print \"n=\"NR, \
         \"p50=\"a[int(NR*0.5)], \"p90=\"a[int(NR*0.9)], \"max=\"a[NR]}'"]
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 65532
      capabilities: { drop: ["ALL"] }
      seccompProfile: { type: RuntimeDefault }
