# 외부 진입 E2E 체인 검증: Gateway → frontend → (ztunnel+waypoint) → api
# 본문(JSON) + "HTTP 200" 출력 — 10-verify-all.sh의 e2e-200 판정이 이 출력을 사용
apiVersion: v1
kind: Pod
metadata:
  name: e2e-test
  namespace: shop
spec:
  restartPolicy: Never
  containers:
  - name: e2e-test
    image: playbuilder/netshoot:latest
    command: ["sh", "-c", "curl -s -w '\\nHTTP %{http_code}\\n' http://shop-gateway.istio-ingress.svc.cluster.local/"]
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 65532
      capabilities: { drop: ["ALL"] }
      seccompProfile: { type: RuntimeDefault }
