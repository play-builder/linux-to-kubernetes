# Istio 설치 전 평문 통신 테스트 (frontend 호출)
# PART 5에서 ambient 적용 후 이 트래픽이 mTLS로 바뀌는 것과 대조
apiVersion: v1
kind: Pod
metadata:
  name: nettest
  namespace: shop
spec:
  restartPolicy: Never
  # 신원이 필요하면 spec.serviceAccountName: frontend 등을 추가
  containers:
  - name: nettest
    image: playbuilder/netshoot:latest
    command: ["curl", "-s", "http://frontend.shop.svc.cluster.local:8080"]
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 65532
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
