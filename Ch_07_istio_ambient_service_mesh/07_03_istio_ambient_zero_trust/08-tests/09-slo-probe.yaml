apiVersion: v1
kind: Pod
metadata:
  name: slo-probe
  namespace: shop
  labels: { drill: game-day }
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: wk2   # 관측자는 훈련 대상 밖 노드에 고정
  containers:
  - name: probe
    image: playbuilder/netshoot:latest   # 운영은 digest 고정
    command: ["sh", "-c",
      "ok=0; ko=0; for i in $(seq 1 120); do \
         c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 \
           http://shop-gateway.istio-ingress.svc.cluster.local/); \
         if [ \"$c\" = \"200\" ]; then ok=$((ok+1)); \
         else ko=$((ko+1)); echo \"$(date +%T) FAIL code=$c\"; fi; \
         sleep 1; done; echo \"RESULT ok=$ok ko=$ko\""]
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 65532
      capabilities: { drop: ["ALL"] }
      seccompProfile: { type: RuntimeDefault }
