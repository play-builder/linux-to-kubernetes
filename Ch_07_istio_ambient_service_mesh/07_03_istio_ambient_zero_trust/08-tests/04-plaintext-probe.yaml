# 07_03_istio_ambient_zero_trust/08-tests/04-plaintext-probe.yaml
# 비편입(mesh 밖) 평문 클라이언트 — STRICT 증상 확인용
apiVersion: v1
kind: Pod
metadata:
  name: plaintext-probe
  namespace: default            # ambient 라벨 없는 네임스페이스 = 비편입
spec:
  restartPolicy: Never
  containers:
  - name: plaintext-probe
    image: playbuilder/netshoot:latest
    command: ["sh", "-c",
      "curl -sv --max-time 5 -o /dev/null -w 'http=%{http_code}\\n' http://api.shop.svc.cluster.local:8080/products; echo exit=$?"]
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 65532
      capabilities: { drop: ["ALL"] }
      seccompProfile: { type: RuntimeDefault }
