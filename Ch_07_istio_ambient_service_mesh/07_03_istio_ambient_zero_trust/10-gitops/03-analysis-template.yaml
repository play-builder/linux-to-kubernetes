# 07_03_istio_ambient_zero_trust/10-gitops/03-analysis-template.yaml
# Prometheus 성공률 판정 — Rollout(02/08)에 연결되는 자동 게이트
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-success-rate
  namespace: shop
spec:
  args:
  - name: service-name
    value: api                    # Rollout에서 덮어쓸 수 있음
  metrics:
  - name: success-rate
    interval: 30s                 # 30초마다 1회 측정
    failureLimit: 1               # 실패 1회 허용 — 2회째 Failed
    successCondition: len(result) > 0 && result[0] >= 0.99
    provider:
      prometheus:
        address: http://prometheus-operated.monitoring.svc.cluster.local:9090
        query: |
          sum(rate(istio_requests_total{
            destination_service=~"{{args.service-name}}.shop.svc.cluster.local",
            response_code!~"5.."}[2m]))
          /
          sum(rate(istio_requests_total{
            destination_service=~"{{args.service-name}}.shop.svc.cluster.local"}[2m]))
