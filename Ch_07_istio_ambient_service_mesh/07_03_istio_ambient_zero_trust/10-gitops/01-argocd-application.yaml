# 07_03_istio_ambient_zero_trust/10-gitops/01-argocd-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/play-builder/linux-to-kubernetes.git
    targetRevision: main
    path: Ch_07_istio_ambient_service_mesh/07_03_istio_ambient_zero_trust/01-app
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
