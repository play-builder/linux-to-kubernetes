# 07_03_istio_ambient_zero_trust/10-gitops/08-rollout-analysis.yaml
# (02-rollout-canary.yaml의 갱신본 — 분석 연결 + 산정 기반 단계. 최종본)
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: shop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      containers:
      - name: api
        image: playbuilder/shop-api:v1.1.0
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
  strategy:
    canary:
      canaryService: api-canary
      stableService: api
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: api-route
            namespace: shop
      analysis:                        # ← 지표 게이트 (백그라운드)
        templates:
        - templateName: api-success-rate
        startingStep: 1                # 5% 단계부터 상시 측정
        args:
        - name: service-name
          value: api
      steps:
      - setWeight: 5                   # 표본: RPS×5%×120s (1.1장)
      - pause: { duration: 120 }
      - setWeight: 25
      - pause: { duration: 120 }
      - setWeight: 50
      - pause: {}                      # 무기한 — 사람 승인 게이트(9장)
      - setWeight: 100
