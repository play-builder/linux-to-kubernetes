# 07_03_istio_ambient_zero_trust/01-app/03-api.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      terminationGracePeriodSeconds: 30          # 종료 예산 명시
      topologySpreadConstraints:                  # 노드 분산 계약
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: { app: api }
      containers:
      - name: api
        # 운영 원칙: tag@digest 병기 (본인 digest로 교체)
        image: playbuilder/shop-api:v1.1.0@sha256:83bbe2ab2966f1e2d3c4b5a6978869504132231405f6e7d8c9b0a1f2e3d4c5b6
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests: { cpu: 50m, memory: 64Mi }   # HPA 기준값 — 실측 보정 대상
          limits:   { memory: 128Mi }            # CPU limit 미설정은 의도
        startupProbe:                             # 부팅 30s 보호
          httpGet: { path: /healthz, port: 8080 }
          periodSeconds: 2
          failureThreshold: 15
        livenessProbe:                            # 보수적 재시작
          httpGet: { path: /healthz, port: 8080 }
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:                           # 민감한 트래픽 차단
          httpGet: { path: /healthz, port: 8080 }
          periodSeconds: 5
          failureThreshold: 2
          successThreshold: 1
        lifecycle:                                # 엔드포인트 전파 대기
          preStop:
            sleep: { seconds: 5 }
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities: { drop: ["ALL"] }
          seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shop
spec:
  selector:
    app: api
  ports:
  - port: 8080
    targetPort: 8080
    appProtocol: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: shop
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api
