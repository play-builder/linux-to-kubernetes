# waypoint Pod 인입을 HBONE(15008) + 헬스 프로브(15021)로 한정 — CNI 계층 이중 방어
# ⚠ 적용 전 프로브 포트 실측 필수:
#   kubectl get deploy api-waypoint -n shop -o yaml | grep -A3 readinessProbe
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: waypoint-hbone-only
  namespace: shop
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: api-waypoint
  policyTypes: [Ingress]
  ingress:
  - ports:
    - { protocol: TCP, port: 15008 }   # HBONE
    - { protocol: TCP, port: 15021 }   # 헬스 프로브(실측 후 확정)
