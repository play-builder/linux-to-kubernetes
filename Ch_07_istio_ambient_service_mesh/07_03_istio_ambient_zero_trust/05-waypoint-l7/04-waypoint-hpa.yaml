apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-waypoint-hpa
  namespace: shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-waypoint          # 1-2장에서 실측한 Deployment 이름
  minReplicas: 2                # 가용성 하한 (1개 손실 허용)
  maxReplicas: 5                # 11장 산정식으로 도출·조정
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # istiod HPA와 동일 기준
