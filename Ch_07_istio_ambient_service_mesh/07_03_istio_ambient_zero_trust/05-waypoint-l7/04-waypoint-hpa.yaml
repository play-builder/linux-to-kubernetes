# 07_03_istio_ambient_zero_trust/05-waypoint-l7/04-waypoint-hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-waypoint-hpa
  namespace: shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-waypoint          # istiod가 자동 생성한 Deployment(게이트웨이명과 동일)
  minReplicas: 2                # 가용성 하한 (1개 손실 허용)
  maxReplicas: 5                # 11장 산정식으로 도출·조정
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # CPU 70% 기준
