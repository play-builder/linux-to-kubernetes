# 07_03_istio_ambient_zero_trust/05-waypoint-l7/01b-api-l4-from-waypoint.yaml
# api L4 정책 — allow-frontend-to-api를 waypoint 신원 기준으로 갱신(대체)
#
# 왜 필요한가:
#   waypoint 도입 후 api Pod에 도달하는 연결의 신원은
#   frontend가 아니라 waypoint(SA: api-waypoint)다.
#     frontend ─▶ ztunnel ─▶ waypoint(신원: api-waypoint) ─▶ api Pod
#   그런데 05B의 L4 정책은 frontend 신원만 허용 → api Pod의 ztunnel이
#   waypoint의 연결을 거부 → waypoint가 클라이언트에 503 반환.
#
# 계층 분담:
#   L4(이 정책, api Pod에서 ztunnel이 집행): waypoint 신원만 통과
#     = api는 waypoint를 우회한 직접 접근을 전부 차단 (Pod IP 직행 포함)
#   L7(02-api-l7-authz, waypoint에서 집행): 클라이언트(frontend)의
#     신원·메서드·경로를 검사
#
# 같은 name/namespace이므로 kubectl apply 시 기존 정책이 이 내용으로 갱신됨.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-frontend-to-api
  namespace: shop
spec:
  selector:
    matchLabels:
      app: api                  # api 워크로드에 적용 (ztunnel이 집행)
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/shop/sa/api-waypoint   # waypoint 신원만 허용
    to:
    - operation:
        ports: ["8080"]
