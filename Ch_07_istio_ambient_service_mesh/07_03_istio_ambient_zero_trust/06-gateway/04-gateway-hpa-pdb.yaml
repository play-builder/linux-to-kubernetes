# 07_03_istio_ambient_zero_trust/06-gateway/04-gateway-hpa-pdb.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shop-gateway-hpa
  namespace: istio-ingress
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shop-gateway-istio      # 자동 생성된 Deployment 이름(실측값으로 교체)
  minReplicas: 2                  # 정문은 최소 2 (1개 손실 허용)
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shop-gateway-pdb
  namespace: istio-ingress
spec:
  minAvailable: 1
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: shop-gateway
