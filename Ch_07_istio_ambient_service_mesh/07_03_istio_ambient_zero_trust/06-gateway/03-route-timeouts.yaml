# frontend-route 최종본 — request/backendRequest 타임아웃 명시 (02의 (4) 갱신본)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: shop
spec:
  parentRefs:
  - name: shop-gateway
    namespace: istio-ingress
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend
      port: 8080
    timeouts:
      request: 10s            # 전체 상한 (사용자 SLO)
      backendRequest: 3s      # 백엔드 시도 1회 상한
