# 07_03_istio_ambient_zero_trust/06-gateway/06-gateway-nodeport.yaml (대안)
# MetalLB 불가 환경의 최후 대안 — 게이트웨이 Pod을 겨냥하는 별도 NodePort Service
# (istiod가 관리하는 자동 생성 Service를 직접 수정하지 않음)
# 관리 포트(15021)는 외부 노출 금지 대상이므로 의도적으로 포함하지 않음
apiVersion: v1
kind: Service
metadata:
  name: shop-gateway-nodeport
  namespace: istio-ingress
spec:
  type: NodePort
  externalTrafficPolicy: Local        # 클라이언트 IP 보존 + 추가 홉 제거
  selector:
    gateway.networking.k8s.io/gateway-name: shop-gateway
  ports:
  - name: http
    port: 80
    targetPort: 80      # ← 실측값으로 교체 (자동 생성 svc와 동일하게)
    nodePort: 30080
