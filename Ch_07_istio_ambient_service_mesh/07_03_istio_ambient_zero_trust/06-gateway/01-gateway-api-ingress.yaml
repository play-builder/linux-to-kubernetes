# 경유 조건: Gateway 라벨 istio.io/ingress-use-waypoint=true + istiod env ENABLE_INGRESS_WAYPOINT_ROUTING
# 본 실습 성립 근거: frontend→api(mesh 내부) 구간은 frontend의 ztunnel이 api waypoint로 전달
# istio-ingress 네임스페이스 (+ ambient 편입 라벨)
apiVersion: v1
kind: Namespace
metadata:
  name: istio-ingress
  labels:
    istio.io/dataplane-mode: ambient
---
# 외부 진입 Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shop-gateway
  namespace: istio-ingress
spec:
  gatewayClassName: istio              # 외부 진입용 (waypoint 아님)
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
---
# frontend로 라우팅하는 HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: shop
spec:
  parentRefs:
  - name: shop-gateway
    namespace: istio-ingress
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend
      port: 8080
    timeouts:
      request: 10s                     # 요청 타임아웃
