# 07_03_istio_ambient_zero_trust/06-gateway/02-gateway-https.yaml
# (1) Gateway 서버 인증서 — 기존 PKI(root-ca-issuer) 재사용
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shop-gateway-cert
  namespace: istio-ingress            # Gateway와 같은 NS → ReferenceGrant 불필요
spec:
  commonName: shop.example.com
  dnsNames: ["shop.example.com"]
  secretName: shop-gateway-tls
  duration: 2160h                     # 90일
  renewBefore: 360h                   # 만료 15일 전 자동 갱신
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: root-ca-issuer, kind: ClusterIssuer }
---
# (2) Gateway 갱신 — https(443) 리스너 추가
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shop-gateway
  namespace: istio-ingress
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    port: 443
    protocol: HTTPS
    hostname: shop.example.com
    tls:
      mode: Terminate                 # 여기서 TLS 해제
      certificateRefs:
      - name: shop-gateway-tls        # (1)이 만들 Secret
    allowedRoutes:
      namespaces:
        from: All
---
# (3) 80 → 443 리다이렉트 (http 리스너 전용)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: istio-ingress
spec:
  parentRefs:
  - name: shop-gateway
    sectionName: http                 # 80 리스너에만 부착
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect: { scheme: https, statusCode: 301 }
---
# (4) frontend 라우트를 https 리스너 전용으로 이동
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: shop
spec:
  parentRefs:
  - name: shop-gateway
    namespace: istio-ingress
    sectionName: https                # 443 리스너에만 부착
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend
      port: 8080
    timeouts:
      request: 10s
