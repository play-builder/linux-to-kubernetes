# istiod 메트릭 (Service 기반)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istiod-monitor
  namespace: monitoring
  labels:
    release: kube-prom
spec:
  selector:
    matchLabels:
      app: istiod
  namespaceSelector:
    matchNames: [istio-system]
  endpoints:
  - port: http-monitoring        # istiod 15014 포트
    interval: 15s
---
# ztunnel 메트릭 (Pod 기반 — DaemonSet이라 PodMonitor)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ztunnel-monitor
  namespace: monitoring
  labels:
    release: kube-prom
spec:
  selector:
    matchLabels:
      app: ztunnel
  namespaceSelector:
    matchNames: [istio-system]
  podMetricsEndpoints:
  - port: ztunnel-stats          # ztunnel 15020 포트
    path: /stats/prometheus
    interval: 15s
---
# waypoint 메트릭 (Envoy 프록시 — L7 메트릭 istio_requests_total 출처)
# waypoint Pod은 표준 prometheus merge 포트(15020)로 Envoy 통계 노출
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: waypoint-monitor
  namespace: monitoring
  labels:
    release: kube-prom
spec:
  selector:
    matchExpressions:
    - key: gateway.networking.k8s.io/gateway-name
      operator: Exists           # 모든 waypoint/Gateway Pod 매칭
  namespaceSelector:
    matchNames: [shop, istio-ingress]
  podMetricsEndpoints:
  - port: mesh-metrics           # waypoint 메트릭 머지 포트(15020)
    path: /stats/prometheus
    interval: 15s
