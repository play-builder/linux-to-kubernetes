# severity 기반 라우팅 — webhook/키는 자리표시자: 커밋 전 Secret 관리로 대체
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"                  # 기본값: Watchdog 등 잡음 흡수
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
      - receiver: pagerduty-oncall      # critical → 온콜 호출
        matchers:
        - severity="critical"
        continue: true                  # 아래 Slack 라우트도 계속 평가
      - receiver: slack-mesh            # warning 이상 → 팀 채널
        matchers:
        - severity=~"warning|critical"
    receivers:
    - name: "null"
    - name: pagerduty-oncall
      pagerduty_configs:
      - routing_key: "<PagerDuty Events API v2 Integration Key>"
        send_resolved: true
    - name: slack-mesh
      slack_configs:
      - api_url: "<Slack Incoming Webhook URL>"
        channel: "#mesh-alerts"
        send_resolved: true
        title: "{{ .CommonLabels.alertname }} [{{ .CommonLabels.severity }}]"
