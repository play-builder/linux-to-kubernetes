# Jaeger Query UI를 NodePort로 노출 (AWS 환경: 워커 퍼블릭 IP:30686 접속)
# port-forward는 SSM 세션에서 로컬 접속이 안 되므로 NodePort 사용
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query-nodeport
  namespace: observability
  labels:
    app.kubernetes.io/name: jaeger
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: jaeger
    app.kubernetes.io/component: all-in-one
  ports:
  - name: query-http
    port: 16686
    targetPort: 16686
    nodePort: 30686        # 워커_퍼블릭_IP:30686 으로 접속
