# 07_03_istio_ambient_zero_trust/07-observability/06-jaeger-nodeport.yaml
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query-nodeport
  namespace: observability
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: jaeger
    app.kubernetes.io/component: all-in-one
  ports:
  - name: query-http
    port: 16686
    targetPort: 16686
    nodePort: 30686        # 워커_퍼블릭_IP:30686 으로 접속
