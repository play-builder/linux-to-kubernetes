apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: istio-ambient-alerts
  namespace: monitoring
  labels:
    release: kube-prom
spec:
  groups:
  - name: istio-ambient.ztunnel
    rules:
    - alert: ZtunnelDown
      expr: absent(up{app="ztunnel"} == 1)
      for: 5m
      labels: { severity: critical }
      annotations: { summary: "ztunnel 노드 프록시 다운" }
  - name: istio-ambient.istiod
    rules:
    - alert: IstiodDown
      expr: absent(up{app="istiod"} == 1)
      for: 5m
      labels: { severity: critical }
      annotations: { summary: "istiod 컨트롤 플레인 다운" }
  - name: istio-ambient.certs
    rules:
    - alert: IstioCertExpiringSoon
      expr: (citadel_server_root_cert_expiry_timestamp - time()) / 86400 < 30
      for: 1h
      labels: { severity: warning }
      annotations: { summary: "Istio Root CA 만료 30일 이내" }
  - name: istio-ambient.traffic
    rules:
    - alert: HighL7ErrorRate
      expr: |
        sum(rate(istio_requests_total{response_code=~"5.."}[5m]))
        / sum(rate(istio_requests_total[5m])) > 0.05
      for: 10m
      labels: { severity: warning }
      annotations: { summary: "waypoint L7 5xx 에러율 5% 초과" }
  - name: istio-ambient.ztunnel-l4
    rules:
    - alert: ZtunnelConnectionSpike
      expr: rate(istio_tcp_connections_opened_total[5m]) > 100
      for: 10m
      labels: { severity: warning }
      annotations: { summary: "ztunnel TCP 연결 급증(L4)" }
