# Jaeger v2 (chart 4.x) — Elasticsearch 백엔드 전환 골격
#
#   이 파일을 그대로 복사하지 말고, 본인 차트 버전의 기본 config 전체 구조를
#   `helm show values jaegertracing/jaeger --version <버전>`으로 확인해 복제한 뒤
#   backends 부분만 교체할 것. 배포 전 `helm template`으로 렌더 결과 필수 확인.
jaeger:
  enabled: true
  extraEnv:
    - name: COLLECTOR_OTLP_ENABLED
      value: "true"
  config:
    extensions:
      jaeger_storage:
        backends:
          primary_store:                  # 백엔드 이름 (query가 참조)
            elasticsearch:                # 하위 필드 스키마는 helm show values로 확인
              server_urls:
                - http://elasticsearch.observability.svc.cluster.local:9200
              indices:                    # 필드 구성은 helm show values로 확인
                index_prefix: jaeger-prod # 인덱스 접두사 (보존정책 적용 단위)
      jaeger_query:
        storage:
          traces: primary_store           # 위 backends 이름과 일치 필수
