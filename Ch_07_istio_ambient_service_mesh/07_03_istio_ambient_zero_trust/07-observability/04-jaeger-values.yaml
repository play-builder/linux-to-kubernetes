# chart 4.x는 기본이 All-In-One + in-memory storage이므로
# storage.type을 명시하지 않습니다(생략 시 자동으로 in-memory).
# 운영 영구 저장은 storage.type: elasticsearch(또는 cassandra) + 해당 backend 설정.
jaeger:
  enabled: true
  image:
    tag: ""              # chart 기본값(검증된 v2) 사용
  extraEnv:
    - name: COLLECTOR_OTLP_ENABLED
      value: "true"      # OTLP 수신 활성화 (4317/4318)
