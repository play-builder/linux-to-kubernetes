# 07_03_istio_ambient_zero_trust/07-observability/01-prometheus-values.yaml
fullnameOverride: kube-prom
prometheus:
  # Prometheus UI 외부 노출 (AWS SSM: 워커 퍼블릭 IP:30090)
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    retention: 7d
    retentionSize: 10GiB
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits:   { memory: 4Gi }
    # 모든 네임스페이스의 ServiceMonitor / PodMonitor / Rule 수집
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 30s
    evaluationInterval: 30s
grafana:
  enabled: true
  adminPassword: "ChangeMeInProduction!"   # 운영: Secret으로 관리
  # Grafana UI 외부 노출 (AWS SSM: 워커 퍼블릭 IP:32000)
  service:
    type: NodePort
    nodePort: 32000
