# 07_03_istio_ambient_zero_trust/04-security/02-authorization-policy.yaml
# frontend → api 만 허용 (L4 only — principals + ports)
# api 워크로드에 ALLOW가 생기는 순간, api는 명시 허용만 통과(default-deny)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-frontend-to-api
  namespace: shop
spec:
  selector:
    matchLabels:
      app: api                  # 이 정책은 api 워크로드에만 적용
  action: ALLOW
  rules:
  - from:
    - source:
        # SPIFFE 신원 기반 — IP가 아닌 신원으로 식별
        principals:
        - cluster.local/ns/shop/sa/frontend
    to:
    - operation:
        # L4 필드만 (포트). method/path는 이후 waypoint에서.
        ports: ["8080"]
