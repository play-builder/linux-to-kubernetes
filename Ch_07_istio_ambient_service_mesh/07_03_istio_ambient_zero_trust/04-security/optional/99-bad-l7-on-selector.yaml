# ⚠⚠ 교육용 오류 재현 — 운영 적용 금지 ⚠⚠
# ⚠ 사고 재현 전용 — 운영 적용 금지, 폴더 일괄 적용 대상에서 제외(optional/)
# selector(ztunnel 처리) + L7 필드(methods/paths) 혼재 → fail-safe DENY
# 적용 시 api 워크로드로 향하는 모든 트래픽(허용 신원 포함)이 전량 차단됨.
# 복구: kubectl delete authorizationpolicy bad-l7-on-selector -n shop
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: bad-l7-on-selector
  namespace: shop
spec:
  selector:
    matchLabels:
      app: api                  # ztunnel이 집행 (L4 전용)
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/shop/sa/frontend"]
    to:
    - operation:
        methods: ["GET"]        # ← L7 필드: ztunnel이 평가 불가 ⚠
        paths: ["/products"]    # ← L7 필드: ztunnel이 평가 불가 ⚠
        ports: ["8080"]
