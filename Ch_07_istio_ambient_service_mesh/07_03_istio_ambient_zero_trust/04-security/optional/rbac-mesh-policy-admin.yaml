# 07_03_istio_ambient_zero_trust/04-security/optional/rbac-mesh-policy-admin.yaml
# 참고용 — mesh 보안 정책 편집권을 플랫폼 팀으로 한정
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mesh-security-policy-admin
rules:
- apiGroups: ["security.istio.io"]
  resources: ["peerauthentications", "authorizationpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mesh-security-policy-view
rules:
- apiGroups: ["security.istio.io"]
  resources: ["peerauthentications", "authorizationpolicies"]
  verbs: ["get", "list", "watch"]
