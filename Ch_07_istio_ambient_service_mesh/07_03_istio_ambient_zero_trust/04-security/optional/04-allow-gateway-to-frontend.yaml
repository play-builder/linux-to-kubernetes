# 참고용(2단계 확장)
# ⚠ principal은 반드시 실측 후 기재:
#   kubectl get pod -n istio-ingress -o jsonpath='{.items[0].spec.serviceAccountName}'
# ⚠ frontend에 ALLOW가 생기는 순간 frontend도 default-deny로 flip —
#   Gateway 외 정당 호출자(테스트 파드 등)의 신원도 함께 등재할 것
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-gateway-to-frontend
  namespace: shop
spec:
  selector:
    matchLabels:
      app: frontend
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/istio-ingress/sa/shop-gateway-istio  # ← 실측값으로 교체
    to:
    - operation:
        ports: ["8080"]
