# (예시 골격 — 비멱등 POST 경로가 생겼을 때 경로별로 타임아웃 예산을 분리)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-retry-timeout
  namespace: shop
spec:
  parentRefs:
  - group: ""             # core group = Service (mesh 방식 — waypoint가 집행)
    kind: Service
    name: api
    port: 8080
  rules:
  - matches:                          # ① 비멱등 경로 먼저 매치
    - method: POST
      path:
        type: PathPrefix
        value: /orders
    timeouts:
      request: 10s
      backendRequest: 3s
    backendRefs:
    - name: api
      port: 8080
    # 비멱등 POST — 재시도 없음(표준 트랙). 재시도 조건 분리는
    # VS Alpha 실험에서만 가능
  - timeouts:                         # ② 나머지(조회 위주) 경로 — 기본 규칙
      request: 10s
      backendRequest: 3s
    backendRefs:
    - name: api
      port: 8080
