# 운영 표준 — Gateway API HTTPRoute
# (ambient waypoint의 공식 L7 구성 API — istio.io ambient l7-features)
# timeouts.request/backendRequest는 Gateway API 표준 필드.
# 재시도는 여기 선언하지 않음 — HTTPRoute retry 필드의 Standard
# 승격 여부는 검증 불가. waypoint 기본 재시도(2회)의 총량 상한은
# 03-retry-guard.yaml(DestinationRule maxRetries)로 통제.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-retry-timeout
  namespace: shop
spec:
  parentRefs:
  - group: ""             # core group = Service (mesh 방식 — waypoint가 집행)
    kind: Service
    name: api
    port: 8080
  rules:
  - timeouts:
      request: 10s        # 요청 전체 예산 (재시도 포함 상한)
      backendRequest: 3s  # 백엔드 1회 시도 예산
    backendRefs:
    - name: api
      port: 8080
