# External Secrets Operator — 외부 비밀 저장소에서 K8s Secret 자동 생성
# YAML 평문(MYSQL_ROOT_PASSWORD: test1234) 제거 → 외부 저장소가 Source of Truth
# (예시: AWS Secrets Manager. Vault면 provider 블록을 vault로 교체)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-store
  namespace: shop
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        # IRSA(ServiceAccount IAM Role) 또는 노드 인스턴스 프로파일 사용
        jwt:
          serviceAccountRef:
            name: api
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-db-credentials
  namespace: shop
spec:
  refreshInterval: 1h          # 1시간마다 외부 저장소와 동기화
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: api-db-secret        # 생성될 K8s Secret 이름
    creationPolicy: Owner
  data:
  - secretKey: db-password     # K8s Secret의 키
    remoteRef:
      key: prod/shop/api       # 외부 저장소의 비밀 경로
      property: db-password
