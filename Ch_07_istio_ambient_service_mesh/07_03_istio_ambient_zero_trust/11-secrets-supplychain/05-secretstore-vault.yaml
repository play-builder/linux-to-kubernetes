apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-secrets-store
  namespace: shop
spec:
  provider:
    vault:
      # <VAULT_SERVER_URL>: 조직의 Vault 주소로 교체 (예: https://vault.internal.company.io:8200)
      server: "<VAULT_SERVER_URL>"
      path: "secret"          # KV 엔진 마운트 경로
      version: "v2"           # KV v2 (버전드 시크릿)
      auth:
        kubernetes:
          mountPath: "kubernetes"   # Vault의 k8s auth 마운트 경로
          role: "shop-api"          # Vault에 정의한 role명
          serviceAccountRef:
            name: api
