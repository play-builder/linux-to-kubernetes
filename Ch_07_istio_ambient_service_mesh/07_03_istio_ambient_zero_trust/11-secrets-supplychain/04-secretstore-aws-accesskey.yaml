# 07_03_istio_ambient_zero_trust/11-secrets-supplychain/04-secretstore-aws-accesskey.yaml
# IRSA 불가 환경(온프레미스 등)의 차선책 — 우선순위: IRSA > 액세스 키
# 선행: 부트스트랩 Secret 생성 필요 (액세스 키는 CI 변수 등으로 주입 — 셸 히스토리 주의)
#   kubectl create secret generic aws-credentials -n shop \
#     --from-literal=access-key-id="<AWS_ACCESS_KEY_ID>" \
#     --from-literal=secret-access-key="<AWS_SECRET_ACCESS_KEY>"
# 이 Secret은 RBAC로 엄격히 보호하고 정기 로테이션 대상에 포함할 것
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-store-key
  namespace: shop
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
