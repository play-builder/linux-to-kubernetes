# 07_03_istio_ambient_zero_trust/11-secrets-supplychain/06-clustersecretstore.yaml
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-central
spec:
  conditions:
  - namespaceSelector:
      matchLabels:
        secrets.company.io/allowed: "true"   # 허용 ns에만 라벨 부여
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: eso-central
            namespace: external-secrets      # 클러스터 스코프라 ns 명시 필수
