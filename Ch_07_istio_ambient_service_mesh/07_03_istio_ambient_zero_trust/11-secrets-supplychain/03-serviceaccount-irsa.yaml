apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: shop
  annotations:
    # EKS: 이 SA의 토큰으로 아래 IAM Role을 Assume (IRSA)
    # <AWS_ACCOUNT_ID>: AWS 계정 ID(12자리)로 교체, Role명(shop-api-secrets-read)도 환경에 맞게 조정
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/shop-api-secrets-read
