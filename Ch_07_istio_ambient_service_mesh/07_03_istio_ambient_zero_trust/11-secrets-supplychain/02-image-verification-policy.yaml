# 이미지 서명 검증 — Kyverno로 Cosign 서명된 이미지만 허용 (공급망 보안)
# 서명 안 된 이미지의 Pod 생성을 admission 단계에서 차단
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
spec:
  validationFailureAction: Enforce   # Audit→경고만 / Enforce→차단
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
  - name: verify-shop-images
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - shop
    verifyImages:
    - imageReferences:
      - "playbuilder/shop-*"
      attestors:
      - count: 1
        entries:
        - keys:
            # Cosign 공개키 (실제 운영은 KMS/Keyless OIDC 권장)
            publicKeys: |-
              -----BEGIN PUBLIC KEY-----
              MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...REPLACE_WITH_REAL_KEY...
              -----END PUBLIC KEY-----
