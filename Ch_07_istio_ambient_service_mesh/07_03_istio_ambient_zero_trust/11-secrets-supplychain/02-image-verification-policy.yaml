# 도입 시 validationFailureAction을 Audit으로 시작해 관찰 후 Enforce로 전환 권장
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
  - name: verify-shop-images
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - shop
    verifyImages:
    - imageReferences:
      - "playbuilder/shop-*"
      attestors:
      - count: 1
        entries:
        - keys:
            publicKeys: |-
              -----BEGIN PUBLIC KEY-----
              MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...REPLACE_WITH_REAL_KEY...
              -----END PUBLIC KEY-----
